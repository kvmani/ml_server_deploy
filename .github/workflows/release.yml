name: Build suite release

# Tagging the deployment repository is the only action a routine release needs.
# Everything below runs on the Internet side; the office server never talks to
# GitHub and only ever sees the two files attached to the Release.
#
# Lean by design: only the gates the air-gapped install depends on. Archive
# reproducibility is covered by tests/unit (test_the_archive_is_reproducible),
# and the systemd rehearsal runs on the development machine (README).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      suite_version:
        description: "Suite version to build (defaults to manifest.yml)"
        required: false

permissions:
  contents: write

jobs:
  build:
    # Must match the office platform: the dependency gate below is only
    # meaningful if it resolves on the same distribution and Python.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out the deployment repository
        uses: actions/checkout@v4
        with:
          path: deploy-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip pyyaml pytest

      # ---------------------------------------------------------------
      # Gate 1: the manifest, the Windows-artifact checks, the unit tests.
      # ---------------------------------------------------------------

      - name: Validate the manifest
        working-directory: deploy-repo
        run: python tools/manifest.py --validate manifest.yml

      # The archive is named from suite_version, but the release is named from
      # the tag. When they disagree you get a release called v1.0.5 containing
      # an archive called v1.1.0, which is exactly as confusing as it sounds and
      # has happened once already: a version bump was applied with sed, the
      # pattern silently matched nothing because someone else had already moved
      # the version, and the mismatch was not noticed until after publication.
      - name: Tag must match suite_version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: deploy-repo
        run: |
          set -euo pipefail
          suite="$(python -c "import yaml; print(yaml.safe_load(open('manifest.yml'))['suite_version'])")"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v${suite}" ]; then
            echo "::error::tag ${tag} does not match manifest suite_version ${suite} (expected v${suite})."
            echo "::error::Bump suite_version in manifest.yml, or tag v${suite} instead."
            exit 1
          fi
          echo "tag ${tag} matches suite_version ${suite}"

      - name: Check text hygiene (CRLF, BOM, shebangs, case collisions)
        working-directory: deploy-repo
        run: python tools/check_text_hygiene.py

      - name: Verify shell scripts are executable and parse
        working-directory: deploy-repo
        run: |
          set -euo pipefail
          fail=0
          for script in deploy/*.sh tests/rehearsal/*.sh; do
            bash -n "$script" || fail=1
            mode="$(git ls-files -s "$script" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error file=$script::mode is $mode, expected 100755. Fix with: git update-index --chmod=+x $script"
              fail=1
            fi
          done
          exit $fail

      - name: Unit tests
        working-directory: deploy-repo
        run: python -m pytest tests/unit -q

      # ---------------------------------------------------------------
      # Gate 2: resolve every component to an immutable commit.
      # ---------------------------------------------------------------

      - name: Resolve component pins to exact commits
        working-directory: deploy-repo
        env:
          # HYDRIDE_TOKEN is only needed if Pushpalathadevi/HydrideSegmentation
          # is private; GITHUB_TOKEN cannot read another owner's private repo.
          GITHUB_TOKEN: ${{ secrets.COMPONENT_READ_TOKEN || github.token }}
        run: |
          python tools/manifest.py --resolve manifest.yml --out manifest.resolved.yml
          echo "--- resolved pins ---"
          cat manifest.resolved.yml

      - name: Check out every component at its pinned commit
        working-directory: deploy-repo
        env:
          GITHUB_TOKEN: ${{ secrets.COMPONENT_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p ../components
          python - <<'PY' > ../checkout.sh
          import yaml
          with open("manifest.resolved.yml", encoding="utf-8") as handle:
              document = yaml.safe_load(handle)
          print("set -euo pipefail")
          for name, service in document["services"].items():
              repo, commit = service["repo"], service["commit"]
              directory = service.get("dir", name)
              print(f'echo "::group::{name} {repo}@{commit}"')
              print(f'git init -q "../components/{directory}"')
              # Deliberately no braces around the variable. GitHub Actions scans
              # the entire workflow file for its own expression syntax (a dollar
              # sign followed by two braces), including inside run: blocks, so
              # emitting that sequence here would make Actions try to evaluate
              # GITHUB_TOKEN as a context and reject the whole workflow before
              # any job starts. Note that this comment must avoid writing the
              # sequence out for exactly the same reason -- an earlier version
              # of this comment did, and broke the workflow it was explaining.
              print(f'git -C "../components/{directory}" remote add origin '
                    f'"https://x-access-token:$GITHUB_TOKEN@github.com/{repo}.git"')
              # Fetching the single pinned commit avoids cloning history we do
              # not ship and makes an unreachable pin fail loudly here.
              print(f'git -C "../components/{directory}" fetch -q --depth 1 origin {commit}')
              print(f'git -C "../components/{directory}" checkout -q FETCH_HEAD')
              print('echo "::endgroup::"')
          PY
          bash ../checkout.sh

      # ---------------------------------------------------------------
      # Gate 3: frontend builds happen here, never in the office.
      # ---------------------------------------------------------------

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend assets
        working-directory: deploy-repo
        run: |
          set -euo pipefail
          python - <<'PY' > ../npm.sh
          import yaml
          with open("manifest.resolved.yml", encoding="utf-8") as handle:
              document = yaml.safe_load(handle)
          print("set -euo pipefail")
          for name, service in document["services"].items():
              build = service.get("npm_build")
              if not build:
                  continue
              directory = service.get("dir", name)
              print(f'echo "::group::npm build {name}"')
              print(f'(cd "../components/{directory}/{build["dir"]}" && {build["command"]})')
              print('echo "::endgroup::"')
          PY
          bash ../npm.sh

      # ---------------------------------------------------------------
      # Gate 4: the dependency set must resolve on this platform, every
      # component must import in it, and every package must be nameable for
      # the office mirror.
      #
      # This is a script rather than inline shell so that the same gate can be
      # run locally before spending a CI cycle. See tools/dependency_gate.py.
      #
      # It deliberately does NOT run each component's own test suite. Doing so
      # coupled the suite release to unrelated scientific test debt in a single
      # component and added a quarter of an hour to every build, while proving
      # nothing about deployability. What matters here is that the pinned
      # components resolve together, pass pip check, and import.
      # ---------------------------------------------------------------

      - name: Dependency gate (install, pip check, import every component)
        working-directory: deploy-repo
        run: |
          # The output is captured and the tail re-emitted as an annotation on
          # failure. The gate annotates its own known error cases, but a plain
          # traceback would otherwise leave nothing behind except "exit code 1",
          # and job logs need repository admin rights to download.
          set -o pipefail
          rc=0
          python -u tools/dependency_gate.py \
            --manifest manifest.resolved.yml \
            --components ../components \
            --venv ../depcheck \
            --out requirements 2>&1 | tee /tmp/gate.log || rc=$?
          if [ "$rc" != "0" ]; then
            echo "::error title=Dependency gate output::$(tail -c 3000 /tmp/gate.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit "$rc"
          fi

      # ---------------------------------------------------------------
      # Assemble the archive and publish it.
      # ---------------------------------------------------------------

      - name: Assemble the suite archive
        id: assemble
        working-directory: deploy-repo
        run: |
          set -euo pipefail
          args=""
          while IFS= read -r line; do args="$args $line"; done < <(
            python - <<'PY'
          import yaml
          with open("manifest.resolved.yml", encoding="utf-8") as handle:
              document = yaml.safe_load(handle)
          for name, service in document["services"].items():
              print(f'--source={name}=../components/{service.get("dir", name)}')
          PY
          )
          # shellcheck disable=SC2086
          sha="$(python tools/build_suite.py --manifest manifest.resolved.yml --out dist $args)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy-repo/dist/*.tar.gz
            deploy-repo/dist/*.tar.gz.sha256
          body: |
            ## ML Server suite ${{ github.ref_name }}

            Download both files, transfer them to the office server together, then run:

            ```
            ./update.sh ml-server-suite-${{ github.ref_name }}.tar.gz
            ```

            The archive contains complete application source for every component
            at its pinned commit. The office server needs no GitHub access; only
            the configured internal pip mirror is used, for dependencies.

            `sha256: ${{ steps.assemble.outputs.sha256 }}`

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            deploy-repo/manifest.resolved.yml
            deploy-repo/requirements/
          if-no-files-found: warn
