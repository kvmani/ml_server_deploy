name: CI

# Lean by design: seconds on Ubuntu, the office platform, with no network beyond pip. It checks the
# deployment machinery itself. The systemd rehearsal runs on the development machine whenever
# deploy/ or tests/rehearsal/ change (README, "The rehearsal"); the release workflow gates what the
# air-gapped install depends on.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pyyaml pytest

      - name: Manifest validation
        run: python tools/manifest.py --validate manifest.yml

      - name: Text hygiene (CRLF, BOM, shebangs, Windows paths, case collisions)
        run: python tools/check_text_hygiene.py

      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          fail=0
          for script in deploy/*.sh deploy/lib/*.sh tests/rehearsal/*.sh; do
            bash -n "$script" || fail=1
            mode="$(git ls-files -s "$script" | awk '{print $1}')"
            case "$script" in
              deploy/lib/*) continue ;;   # sourced, not executed
            esac
            if [ "$mode" != "100755" ]; then
              echo "::error file=$script::mode is $mode, expected 100755"
              fail=1
            fi
          done
          exit $fail

      - name: Unit tests
        run: python -m pytest tests/unit -q
