name: CI

# Runs on every push. Deliberately does NOT touch the component repositories or
# the network beyond the runner: this is about whether the deployment machinery
# itself is sound, which is the part that is expensive to get wrong.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip pyyaml pytest

      - name: Manifest validation
        run: python tools/manifest.py --validate manifest.yml

      - name: Text hygiene (CRLF, BOM, shebangs, Windows paths, case collisions)
        run: python tools/check_text_hygiene.py

      - name: Shell syntax and executable bits
        run: |
          set -euo pipefail
          fail=0
          for script in deploy/*.sh deploy/lib/*.sh tests/rehearsal/*.sh; do
            bash -n "$script" || fail=1
            mode="$(git ls-files -s "$script" | awk '{print $1}')"
            case "$script" in
              deploy/lib/*) continue ;;   # sourced, not executed
            esac
            if [ "$mode" != "100755" ]; then
              echo "::error file=$script::mode is $mode, expected 100755"
              fail=1
            fi
          done
          exit $fail

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -x deploy/*.sh deploy/lib/*.sh tests/rehearsal/*.sh

      - name: Unit tests
        run: python -m pytest tests/unit -q

  rehearsal:
    # The scenarios that need a real user systemd session. If the runner cannot
    # provide one, the job reports that rather than passing silently.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml

      - name: Deployment rehearsal
        run: |
          set -euo pipefail
          chmod +x deploy/*.sh tests/rehearsal/*.sh
          sudo loginctl enable-linger "$USER" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          if systemctl --user is-system-running >/dev/null 2>&1; then
            ./tests/rehearsal/run.sh
          else
            echo "::warning::no user systemd session; running the non-systemd scenarios only."
            echo "::warning::systemd coverage comes from the WSL rehearsal on the development machine."
            ./tests/rehearsal/run.sh corrupt_archive missing_checksum truncated_archive \
              path_traversal not_a_suite_archive wrong_platform legacy_layout
          fi

      - name: Upload rehearsal logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-logs
          path: ~/rehearsal/work/*/shared/logs/
          if-no-files-found: ignore
