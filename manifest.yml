# ML Server suite -- authored deployment manifest.
#
# This is the ONLY file a routine release edits: bump a component's `ref`, tag
# the suite, and GitHub Actions does the rest.
#
# `commit` is deliberately empty here and mandatory in the released manifest.
# The workflow resolves each `ref` to its exact SHA and fails the build if a tag
# cannot be resolved, which is what makes "every release resolves to exact
# immutable component commits" enforceable rather than aspirational.
#
# Ports, health endpoints and start commands below were taken from the running
# system as documented in ml_server/docs/PRODUCTION_RELEASE_2026_08.md; confirm
# them against inventory.sh output from the real office host before the first
# production release.

schema: ml-suite.manifest.v1
suite_version: 1.13.0

platform:
  os_id: ubuntu
  os_version_min: "22.04"
  python_min: "3.12"

runtime:
  user: kvmani
  # Probed in order by detect_layout(); an explicit --root always overrides.
  root_candidates:
    - /home/kvmani/ml_platform
    - /opt/ml_server
  systemd_scope: auto        # auto | user | system | none
  unit_prefix: ml-platform-

  # The address the services listen on.
  #
  # This is 0.0.0.0 because the office server has NO reverse proxy in front of
  # it -- see docs/office_inventory_reference.txt, section 11 -- and users reach
  # the portal directly on its port from elsewhere on the intranet. Binding to
  # 127.0.0.1 would take the whole site off the network while every health check
  # on the host itself still passed, so the breakage would look like a success.
  #
  # Set this to 127.0.0.1 only once something else is terminating connections in
  # front of the suite.
  bind_host: "0.0.0.0"

  # The existing deployment groups its units under a target, so `systemctl
  # --user start ml-platform.target` brings the whole suite up. Units are
  # rendered WantedBy this target to preserve that.
  systemd_target: ml-platform.target

  # The address OTHER machines on the intranet use to reach this server.
  #
  # bind_host above is what the sockets listen on; this is what the portal must
  # put in the links it renders. They are not the same thing, and conflating
  # them is what produced the v1.4.0 symptom: every catalog link pointed at
  # 127.0.0.1, which works perfectly from the server itself and is useless from
  # any other desk.
  #
  #   auto   -- the address of the interface holding the default route
  #   <ip>   -- a fixed address or hostname, when auto picks the wrong NIC
  #
  # Override per-run without editing this file:
  #   ./update.sh <archive> --intranet-host 10.x.y.z
  #   ML_INTRANET_HOST=10.x.y.z ./update.sh <archive>
  intranet_host: auto

  # Environment file rendered into EnvironmentFile= for services that name it
  # in `env_file` below. It lives in shared/, so it survives every upgrade and
  # rollback, and update.sh seeds it (see `seeds:`) before any unit is written.
  env_file: shared/config/ml-platform.env

# Persistent state lives here, outside every release directory, and is never
# touched by update.sh or rollback.sh.
shared_dirs:
  - data
  - models
  - uploads
  - config
  - logs
  - tmp
  - state
  # Documentation built on this server (see `docs_build` under services). It
  # lives here rather than inside a release because a release directory is
  # replaced on every upgrade and removed on every prune, and rebuilding tens
  # of minutes of Sphinx output on each deployment to produce identical pages
  # is not a thing to do to an operator waiting for a rollout to finish.
  - docs

# Persistent state that must EXIST before the services are started, and that no
# release archive can carry.
#
# shared_dirs above only creates empty directories. That is what produced three
# separate v1.4.0 failures: the portal had no environment file so it fell back
# to loopback links, hydride had an empty frozen_checkpoints/ so its warm load
# could not resolve a model from the registry, and shared/config held no
# config.intranet.json at all.
#
# Each entry below is seeded ONCE, from the first `sources` path that exists and
# is itself populated, and is never overwritten afterwards -- so an operator's
# hand-edited env file survives every subsequent upgrade untouched.
#
#   kind      file | tree
#   target    path under the deployment root; always inside shared/
#   marker    tree only: the file that proves the target is really populated,
#             rather than merely existing. Empty means "any file counts".
#   sources   searched in order. Tokens: {root} {release} {previous} {backup}
#             {home}. {backup} is this run's checkpoint under backups/<stamp>.
#   generate  a built-in generator to fall back on when no source exists:
#               service_urls -- write KEY=http://<intranet_host>:<port> for every
#                               service declaring `public_url_env` below
#   required  true means preflight REFUSES the deployment when the target is
#             absent and nothing can supply it, so the failure lands before
#             anything has changed rather than as a health-check rollback.
#             Override for a one-off with --allow-missing-seeds.
seeds:
  - id: portal-env
    kind: file
    target: shared/config/ml-platform.env
    required: true
    generate: service_urls
    sources:
      - "{backup}/config/ml-platform.env"
      - "{root}/config/ml-platform.env"
      - "{previous}/apps/ml_server/config/ml-platform.env"
      - "{release}/apps/ml_server/config/ml-platform.env.example"
    why: >-
      The portal renders the catalog links other people click. Without these
      variables it falls back to 127.0.0.1 and every link is dead from every
      desk but this one. The pre-suite office unit loaded this file from
      {root}/config/ml-platform.env, which is why that path is searched.

  - id: server-config
    kind: file
    target: shared/config/config.intranet.json
    required: false
    sources:
      - "{backup}/config/config.intranet.json"
      - "{root}/config/config.intranet.json"
      - "{previous}/apps/ml_server/config/config.intranet.json"
      - "{release}/apps/ml_server/config/config.intranet.json"
    why: >-
      ML_SERVER_CONFIG points every gateway unit at this file. It holds site
      settings and secrets that cannot be generated, so a missing one is a loud
      warning rather than a refusal: the release template is copied when it
      ships one, and otherwise the portal falls back to its built-in defaults.

      Seeding only ever creates it. An EXISTING file is never overwritten --
      it is validated and migrated instead, in update.sh phases A9e and B4c,
      using the config schema from the release being installed. Legacy key
      spellings are renamed, new settings are added with defaults, every local
      value is preserved, the original is backed up beside it, and a migration
      that would be a guess refuses the deployment before anything changes.

  - id: hydride-models
    kind: tree
    target: shared/models/hydride
    marker: model_registry.json
    required: true
    sources:
      - "{previous}/apps/HydrideSegmentation/frozen_checkpoints"
      - /opt/microseg/HydrideSegmentation/frozen_checkpoints
      - "{home}/ml_platform/src/hydride/HydrideSegmentation-main/frozen_checkpoints"
    why: >-
      The trained checkpoints are not in git -- frozen_checkpoints/ holds only
      .gitkeep files -- so they can never travel in a release archive. The
      pre-suite install kept them at /opt/microseg, and that is a real populated
      copy on this host, so they are adopted from there on the first deployment
      and live in shared/models/hydride from then on.

  - id: hydride-test-library
    kind: tree
    target: shared/data/test_library
    marker: ""
    required: false
    sources:
      - "{previous}/apps/HydrideSegmentation/test_library"
      - /opt/microseg/HydrideSegmentation/test_library
      - "{home}/ml_platform/src/hydride/HydrideSegmentation-main/test_library"
      - "{release}/apps/HydrideSegmentation/sample_images"
    why: >-
      Sample micrographs for the segmentation UI. Nothing can invent these, so
      an empty library is a warning and not a failure: the service falls back to
      its two built-in example images and says so in the journal. Drop a set of
      .tif files into shared/data/test_library once and every future release
      picks them up through the shared link.

# How code is put on the path.
#
# Only third-party DEPENDENCIES are installed into the virtual environment; the
# application code itself is never pip-installed. Each service runs out of its
# own release directory via PYTHONPATH, which is what makes rollback a pure
# symlink swap plus a restart -- no reinstall, no network, no mirror needed at
# the exact moment things are already going wrong.
#
# `src` below is the directory to prepend to PYTHONPATH, relative to the
# component's directory in the release tree.
#
# Paths use {current}, never {release}: a versioned path would change the text of
# every systemd unit on every release, so update.sh would restart all seven
# services even when only one component actually changed.
#
# `import_check` names the module that must import cleanly in the shared
# environment. That is the deployment-relevant question, and it is what the
# release gate enforces. The `tests:` commands below are each component's own
# full suite; they are NOT run by the release build. Running them there coupled
# the suite release to unrelated scientific test debt in a single component and
# added a quarter of an hour to every build, while telling us nothing about
# whether the suite would deploy. Each component repository owns its own CI.
# Pass --run-component-tests to tools/dependency_gate.py to run them by hand.

# System packages the deployment needs but will never install for you.
#
# Installing OS packages is the operator's job: it needs root, it comes from the
# office's own apt mirror, and a deployment script silently changing the system
# is not something anyone wants to debug later. Preflight checks for all of them
# at once and, if any are missing, stops before changing anything and prints the
# exact command to install them. Fix them all in one go, then re-run.
system_requirements:
  - command: sqlite3
    package: sqlite3
    why: >-
      Taking a consistent backup of the engagement database before an upgrade.
      Without it the backup falls back to cp, which can copy a torn file from a
      live write-ahead log and produce a backup that only looks valid.
  - command: pdftoppm
    package: poppler-utils
    why: >-
      PDF page previews in the PDF Tools workbench; pdf2image shells out to this
      binary, so previews fail at runtime without it.
  - command: ss
    package: iproute2
    why: >-
      Detecting whether a service port is already in use, which is how a clash
      with another application is caught before anything is deployed.

# Extra package indexes needed to install the pinned set.
#
# torch resolves to a local version such as `2.13.0+cpu`, and that wheel exists
# only on a PyTorch CPU index -- never on PyPI. Installing resolved.txt without
# this fails on torch alone, which is precisely what happened the first time the
# real archive was installed.
#
# The office server should point this at its own internal mirror. Override it
# without editing the manifest, either way:
#   ML_PIP_EXTRA_INDEX_URL=http://pytorch-cpu.intranet.local/whl/cpu ./update.sh ...
#   ./update.sh <archive> --extra-index-url http://pytorch-cpu.intranet.local/whl/cpu
# Set ML_PIP_EXTRA_INDEX_URL to the empty string to use only the configured
# mirror in /etc/pip.conf.
pip:
  extra_index_urls:
    - https://download.pytorch.org/whl/cpu

  # Packages that are already installed in the office environment, by hand and
  # offline, and that update.sh must therefore never install, upgrade or touch.
  #
  # torch is the case this exists for. Its CPU wheels are large, are not on
  # PyPI, and were installed on the office server deliberately. resolved.txt
  # pins an exact version, and pip treats "2.13.0+cpu" and "2.4.0+cpu" as
  # different requirements -- so without this list an install would try to
  # download a specific torch build and fail on an air-gapped host, even though
  # a perfectly good torch was already present.
  #
  # These are verified to be present during preflight instead. A missing one
  # stops the deployment before anything is changed, naming the environment it
  # must be installed into.
  preinstalled:
    - torch
    - torchvision

environments:
  shared:
    path: .venv
    # Hydride is included here by explicit decision.  It pulls torch, opencv,
    # transformers and albumentations into the same environment as the portal
    # (Flask==3.0.2) and tabular_ml (numpy<3).  The release workflow runs
    # `pip check` on the combined environment as a blocking gate; if that gate
    # ever fails, set `env: isolated` on the hydride service below and the
    # scripts will build it a separate venv.  No other change is required.
    python: python3.12

services:

  gateway:
    repo: kvmani/ml_server
    # 1.3.1 fixes the admin sign-in failure seen from suite v1.4.0 to v1.6.0
    # (a Secure session cookie on a plain-HTTP site, and a signing key that
    # differed between the two gunicorn workers) and adds the versioned config
    # schema that update.sh validates and migrates shared/config against.
    ref: v1.3.1
    commit: ""
    dir: ml_server
    import_check: ml_server
    src: src
    env: shared
    requirements: [requirements.txt]
    unit: ml-platform-portal.service
    # The portal is the gateway, so it comes up after the services it routes to.
    after: [ml-platform-hydride.service, ml-platform-pytex.service,
            ml-platform-calculator.service, ml-platform-converter.service,
            ml-platform-annotator.service]
    wants: [ml-platform-hydride.service, ml-platform-pytex.service,
            ml-platform-calculator.service, ml-platform-converter.service,
            ml-platform-annotator.service]
    port: 5000
    health: /health/live
    health_deep: /health
    start: >-
      {venv}/bin/gunicorn --bind {bind}:{port} --workers 2 --timeout 300
      ml_server.app.server:create_app()
    workdir: "{current}/apps/ml_server"
    # Rendered as EnvironmentFile= in the unit. The pre-suite office unit had
    # exactly this directive and the first suite-rendered one did not, which is
    # the whole of root cause 1 in the v1.4.0 report: systemd started the portal
    # with none of the *_URL variables set and it fell back to loopback links.
    #
    # Written as a hard EnvironmentFile=, not EnvironmentFile=-, deliberately:
    # a portal that silently starts without its URLs looks healthy to every
    # check on the host and is broken for every user. update.sh seeds the file
    # in Phase B before it writes this unit, so it always exists.
    env_file: shared/config/ml-platform.env
    environment:
      # pdf_tools and tabular_ml are imported in-process by the portal, so their
      # source trees must be on the gateway's path too.
      PYTHONPATH: "{current}/apps/ml_server/src:{current}/apps/pdf_tools/src:{current}/apps/tabular_ml/src"
      ML_SERVER_CONFIG: "{root}/shared/config/config.intranet.json"
      APP_FEEDBACK__DATABASE_PATH: "{root}/shared/data/engagement.sqlite3"
      APP_ANALYTICS__ENABLED: "true"
    # Portal v1.2.0 adds a password-protected operations console at /admin/:
    # live per-IP activity, per-service timing percentiles, unique-visitor
    # counts and filterable logs.
    #
    # Its credential is deliberately NOT set here. A password in the manifest is
    # a password in git, in CI and in every release archive, which is the one
    # place it must never be. The console reads
    # ML_SERVER_ADMIN_PASSWORD_HASH from the service environment, and with
    # nothing configured it refuses every login rather than falling open -- so a
    # deployment that skips this step is safe, it simply has no console.
    #
    # To enable it, add one line to shared/config/ml-platform.env on the server
    # (that file is seeded once and survives every upgrade untouched, so this is
    # done once and not per release), then restart the portal:
    #
    #     ML_SERVER_ADMIN_PASSWORD_HASH=pbkdf2:sha256:600000$...
    #
    # See docs/ADMIN_DASHBOARD.md in the ml_server component for how to generate
    # the hash. The portal rejects placeholder values such as "changeme" and
    # "password", so a half-finished configuration fails closed.
    shared_links:
      data: shared/data
      logs: shared/logs
      tmp: shared/tmp
    tests: "python -m pytest -q"
    # The portal is the gateway; these are the paths it must be able to reach.
    gateway_checks:
      - /api/catalog
      - /pdf_tools/
      - /tabular_ml/
      - /static/vendor/mathjax/tex-chtml-full.js

  pytex:
    repo: kvmani/pytex
    ref: v0.10.0
    commit: ""
    dir: pytex
    import_check: pytex
    src: src
    env: shared
    requirements: []
    unit: ml-platform-pytex.service
    # The variable the portal reads to link to this service from the catalog.
    # generate: service_urls in `seeds` builds the env file out of these.
    public_url_env: PYTEX_URL
    port: 8765
    health: /api/health
    start: "{venv}/bin/python -m pytex.app serve --host {bind} --port {port}"
    workdir: "{current}/apps/pytex"
    environment:
      PYTHONPATH: "{current}/apps/pytex/src"
      # `docs_root()` checks this first, ahead of the copy a wheel would carry
      # and ahead of any build lying in a checkout. It points at persistent
      # state, so the documentation survives an upgrade, a rollback and a
      # prune; when the directory does not exist the workbench simply answers
      # 404 on /docs and everything else is unaffected.
      PYTEX_DOCS_ROOT: "{root}/shared/docs/pytex"
    tests: "python -m pytest -q"

    # Documentation built on this server, after the suite is already up.
    #
    # PyTex renders its Sphinx site into the installed package, which works for
    # a wheel and cannot work here: the suite runs application code from source
    # over PYTHONPATH, deliberately, because that is what makes a rollback a
    # symlink swap needing no network. The built site is ~55 MB of generated
    # output and is git-ignored like any other build product, so it reaches
    # neither the component checkout nor the release archive, and /docs has
    # answered 404 on this host since the workbench gained the route.
    #
    # Building it here rather than shipping it keeps the archive small and the
    # documentation matched to the exact commit deployed.
    #
    # Three properties make this safe to run on a production rollout:
    #
    #   1. It runs LAST, after health checks have passed and the deployment has
    #      been recorded. The suite is already serving; this only adds a route.
    #   2. It can never fail the deployment. A missing Sphinx, an unreachable
    #      mirror, a notebook that will not execute -- each is a warning, and
    #      /docs stays as it is today.
    #   3. It is keyed to the component commit, so a suite release that does
    #      not move PyTex reuses the build instead of repeating it.
    #
    # The cost when it does run is real: the site executes 34 notebooks, so
    # allow tens of minutes. Nothing waits on it.
    docs_build:
      target: shared/docs/pytex
      marker: index.html
      command: "python scripts/build_docs_bundle.py --output {target}"
      # Installed into the shared environment before the build. These are the
      # only packages the office mirror needs for it; every scientific package
      # the notebooks import is already a required PyTex dependency.
      requirements: [".[docs]"]
      timeout_seconds: 5400
      why: >-
        The workbench serves its own theory notes, algorithm pages and worked
        examples at /docs. They are the reference an operator reads at the
        bench, and on an air-gapped host there is nowhere else to read them.
    # Dependencies are unchanged since 0.5.0, which moved pymatgen, orix,
    # diffsims, KikuchiPy, matplotlib and h5py out of the optional `adapters`
    # extra into the required set. The dependency gate picks them up from
    # `[project] dependencies` like anything else, so they reach resolved.txt
    # and the office venv, and `dev` is all the test run needs on top.
    #
    # v0.8.1 added phase identification: the workbench can be given several
    # candidate structures -- catalogue entries or .cif files -- and asked which
    # of them a measured powder scan is, rather than being told the phase and
    # asked to measure something about it.
    #
    # v0.9.0 adds two things users on this server will notice.
    #
    # A progress bar across the whole workbench. Any call in flight now shows
    # what is being waited for, how long it has taken, and how much longer it is
    # likely to take. It matters here more than anywhere: on the office server
    # the machine is shared and a thirty-second refinement with no feedback is
    # indistinguishable from a hung service, which is what generates the support
    # call. Where an operation can count its own work the percentage is measured;
    # where it cannot the bar shows elapsed time and, after a couple of runs, an
    # estimate learned from them and labelled as one.
    #
    # And the HRTEM workspace, which was shipped in 0.8.x but could not actually
    # run in a browser -- every button on it threw against a shell API that does
    # not exist. It works now, and reaches the full residual aberration set of a
    # corrected instrument. Anyone who tried that panel on this server and found
    # it dead should be told it is fixed.
    #
    # Both are pure-Python surface on the dependencies already deployed; nothing
    # new to mirror.
    #
    # Its documentation is built on this server after the deployment; see
    # `docs_build` below and the RUNBOOK. v0.8.1 was the first release whose
    # bundle builder takes an --output, which is what lets that build write into
    # shared/ instead of into the release tree.
    test_extras: [dev]

  calculator:
    repo: kvmani/scientific_calculator
    ref: v0.6.0
    commit: ""
    dir: scientific_calculator
    import_check: scientific_calculator_service
    src: src
    env: shared
    requirements: [requirements.txt]
    unit: ml-platform-calculator.service
    # The variable the portal reads to link to this service from the catalog.
    # generate: service_urls in `seeds` builds the env file out of these.
    public_url_env: SCIENTIFIC_CALCULATOR_URL
    port: 5055
    health: /api/health
    start: "{venv}/bin/python app.py --host {bind} --port {port}"
    workdir: "{current}/apps/scientific_calculator"
    environment:
      PYTHONPATH: "{current}/apps/scientific_calculator/src"
    tests: "python -m pytest -q"

  converter:
    repo: kvmani/unit_converter
    ref: v0.2.0
    commit: ""
    dir: unit_converter
    import_check: unit_converter_service
    src: src
    env: shared
    requirements: [requirements.txt]
    unit: ml-platform-converter.service
    # The variable the portal reads to link to this service from the catalog.
    # generate: service_urls in `seeds` builds the env file out of these.
    public_url_env: UNIT_CONVERTER_URL
    port: 5065
    health: /api/health
    start: "{venv}/bin/python app.py --host {bind} --port {port}"
    workdir: "{current}/apps/unit_converter"
    environment:
      PYTHONPATH: "{current}/apps/unit_converter/src"
    tests: "python -m pytest -q"

  annotator:
    # Online Annotator: create, review and export segmentation ground truth.
    # New in suite 1.7.0 (portal 1.3.0 adds its catalog card).
    #
    # Unlike every other service it keeps data by design -- a team's images,
    # label maps, versions, exports and audit trail -- so its data directory is
    # under shared/ and survives every upgrade and rollback untouched.
    #
    # The first start creates an administrator with a one-time password, written
    # to shared/data/online_annotator/initial_admin_password.txt and the journal.
    # ONLINE_ANNOTATOR_* lines in the env file (e.g. ONLINE_ANNOTATOR_ADMIN_EMAIL,
    # SMTP settings) override the Environment= lines below.
    #
    # The portal link is host-relative (":5000/"): the browser resolves it against
    # the address the user typed, so it works from every desk without knowing
    # this host's intranet address.
    #
    # Annotator 1.1.0 (suite 1.8.0) added mask import and migrated the database
    # to schema 2 on first start: in place, additive, annotations untouched.
    # Annotator 1.0.x refuses to start on a schema-2 database by design, so a
    # rollback to suite 1.7.0 or earlier needs the annotator data directory
    # restored from backup -- see "Rollback" in RUNBOOK.md. Every other
    # component, and a rollback to 1.8.0, behaves normally.
    #
    # 1.1.1 is 1.1.0 with two flaky browser tests fixed; no product code differs.
    # It is taken here because its tag is the one with a green CI run.
    #
    # Annotator 2.0.0 (suite 1.10.0): every user can annotate AND review, switching
    # an Annotate / Review working mode in the web UI; administrator is a separate
    # privilege. On its first start it saves a copy of its database under
    # shared/data/online_annotator/backups/ and upgrades it to schema 3
    # (users.role -> is_admin + active_mode; administrators stay administrators,
    # former reviewers start in Review mode). Annotator 1.x refuses a schema-3
    # database, so rolling the suite back past 1.10.0 needs that copy restored --
    # see "Rollback" in RUNBOOK.md. Nothing else in the suite is affected.
    #
    # Annotator 2.1.0 (suite 1.12.0): mask import explains what it detected and which
    # class numbers it will store before anything is saved, asks for confirmation when
    # a file reads two ways, needs an explicit threshold for greyscale images, and records
    # the interpretation (mask_import) in versions, the audit trail and export manifests.
    # It pairs HydrideSegmentation's <stem>_mask_labels.png / _mask_preview.png. On first
    # start it backs up its database and upgrades it to schema 4 (additive columns
    # images/versions.mask_import_details); annotator 2.0.x refuses a schema-4 database,
    # so rolling back past 1.12.0 needs that copy restored -- see "Rollback" in RUNBOOK.md.
    #
    # Annotator 2.2.0 (suite 1.13.0): a Polygon threshold tool (Otsu inside a clicked
    # outline), number boxes for brush/eraser diameter, wand tolerance and threshold, and
    # [ ] changing the current tool's value. Browser-only change: schema stays 4, no new
    # dependencies, so rolling back to 1.12.0 needs nothing restored.
    repo: kvmani/OnlineAnnotator
    ref: v2.2.0
    commit: ""
    dir: OnlineAnnotator
    import_check: online_annotator
    src: src
    env: shared
    requirements: [requirements.txt]
    unit: ml-platform-annotator.service
    public_url_env: ONLINE_ANNOTATOR_URL
    port: 5070
    health: /api/health
    start: "{venv}/bin/python -m online_annotator serve --host {bind} --port {port}"
    workdir: "{current}/apps/OnlineAnnotator"
    env_file: shared/config/ml-platform.env
    environment:
      PYTHONPATH: "{current}/apps/OnlineAnnotator/src"
      ONLINE_ANNOTATOR_DATA_DIR: "{root}/shared/data/online_annotator"
      ONLINE_ANNOTATOR_PORTAL_URL: ":5000/"
    tests: "python -m pytest -q"

  # pdf_tools and tabular_ml are mounted in-process by the gateway rather than
  # run as their own services, so they have no unit and no port of their own.
  pdf_tools:
    repo: kvmani/pdf_tools
    ref: v0.2.0
    commit: ""
    dir: pdf_tools
    import_check: pdf_tools_service
    src: src
    env: shared
    requirements: []
    in_process: true
    mount: /pdf_tools/
    health: /pdf_tools/health
    via: gateway

  tabular_ml:
    repo: kvmani/tabular_ml
    ref: v0.2.0
    commit: ""
    dir: tabular_ml
    import_check: tabular_ml_service
    src: src
    env: shared
    requirements: []
    in_process: true
    mount: /tabular_ml/
    health: /tabular_ml/api/v1/health
    via: gateway
    npm_build:
      dir: frontend
      command: "npm ci && npm run build"
      output: dist
    tests: "python -m pytest -q"

  hydride:
    # Note the different GitHub owner; the release workflow needs a token with
    # read access if this repository is private.
    repo: Pushpalathadevi/HydrideSegmentation
    # Tagged v1.0.1 in that repository with the owner's authorisation, so this
    # is pinned the same way as every other component.
    #
    # v1.1.0 (suite 1.12.0), also tagged with the owner's authorisation: the web
    # "Download mask" menu adds <stem>_mask_labels.png (class IDs 0/1, for training and
    # OnlineAnnotator), <stem>_mask_preview.png (display 0/255) and <stem>_masks.zip with
    # JSON metadata; the previous mask download is unchanged. No new dependencies and no
    # persistent state. Its version files still read 1.0.0 (the bump is uncommitted in that
    # repository); the resolved commit in the released manifest is the exact identity.
    ref: v1.1.0
    commit: ""
    # Flat package at the repository root, not a src/ layout like the others.
    dir: HydrideSegmentation
    import_check: hydride_segmentation
    src: "."
    env: shared                        # flip to `isolated` if the pip-check gate fails
    requirements: [requirements-web.txt]
    unit: ml-platform-hydride.service
    # The variable the portal reads to link to this service from the catalog.
    # generate: service_urls in `seeds` builds the env file out of these.
    public_url_env: HYDRIDE_SEGMENTATION_URL
    port: 5005
    health: /health
    start: >-
      {venv}/bin/python scripts/run_web_server.py --host {bind} --port {port}
      --threads 4 --preload --no-print-urls
    workdir: "{current}/apps/HydrideSegmentation"
    environment:
      PYTHONPATH: "{current}/apps/HydrideSegmentation"
    # The trained checkpoints are NOT in git (frozen_checkpoints/ holds only
    # .gitkeep files), so they can never travel in the release archive.  They
    # live in shared/models and are supplied to the server out of band, once.
    shared_links:
      frozen_checkpoints: shared/models/hydride
      # The sample micrographs the segmentation UI offers for a trial run. The
      # service looks for apps/HydrideSegmentation/test_library and falls back
      # to two built-in examples when it is missing; linking it to shared/ means
      # a library supplied once is there for every future release.
      test_library: shared/data/test_library
    requires_models: true
    # Checked after the restart: the link must resolve to a directory that
    # really holds this file, not to the empty one the archive shipped.
    model_registry: model_registry.json

# Post-deployment assertions.
#
# health_check.sh runs these in addition to the unit, endpoint and route checks
# it has always made. They exist because v1.4.0 passed every one of those and
# was still broken for its users: all five units were active, every /health
# returned 200, and the portal was advertising loopback URLs while hydride
# served without a model.
verify:
  # Every standalone unit in `services` must report active. Listed explicitly
  # so the assertion is visible here rather than only in the script.
  units_must_be_active: true

  # What the portal tells other machines to connect to.
  catalog:
    path: /api/catalog
    # Checked only when the intranet host is known and is not itself loopback,
    # so a laptop-bound test deployment does not fail on its own correct answer.
    reject:
      - "127.0.0.1"
      - "localhost"
      - "0.0.0.0"

  # Journal assertions, read from each unit's CURRENT run only -- since its
  # ActiveEnterTimestamp -- so a fault fixed by this very deployment cannot fail
  # the check from a stale entry.
  #
  #   forbid    any match fails the check at `severity`
  #   require   absence is only ever a warning: log wording belongs to the
  #             component, and a quiet journal after --no-restart is not a fault
  journal:
    - service: hydride
      severity: fail
      lines: 500
      forbid:
        - "Warm load failed"
        - "could not be resolved from the registry"
      require: "Model preload finished"
    - service: hydride
      severity: warn
      lines: 500
      forbid:
        - "Image library is unavailable"

# Packages that must be installable from the office mirrors.  The release
# workflow writes the fully resolved list to requirements/mirror_audit.txt; this
# section only records the non-obvious ones worth checking with IT in advance.
mirror_notes:
  - "torch and torchvision must come from a CPU-only index; the default wheels
     bundle the CUDA runtime and add several GB for no benefit on this host."
  - "poppler-utils (apt) provides pdftoppm, required by pdf2image for previews."
  - "PyTex's `docs` extra -- sphinx, furo, myst-nb, myst-parser, sphinx-design,
     sphinx-copybutton and sphinxcontrib-bibtex -- is needed only for the
     on-server documentation build (`docs_build` on the pytex service). All are
     pure-Python wheels on PyPI. Without them the build is skipped with a
     warning and /docs answers 404; nothing else is affected, so this is the
     one entry on this list that is optional."
  - "The gateway's requirements.txt resolves pdf_tools and tabular_ml from
     GitHub archive URLs; build_suite.py rewrites those to local paths, because
     an air-gapped host cannot fetch them."
  - "PyTex (pinned at v0.9.0) requires pymatgen, orix, diffsims, kikuchipy, matplotlib and
     h5py, so they are now part of the deployed environment rather than an
     extra that was left out of it. That closes the gap where CIF loading and
     CBED symmetry raised ModuleNotFoundError on the office server while
     working everywhere else. Their own transitive set is the thing to check
     with IT: spglib, numba and llvmlite (pymatgen and kikuchipy), hyperspy and
     its Rosettasciio readers (kikuchipy), and pillow, kiwisolver, fonttools,
     contourpy and cycler (matplotlib). All are on PyPI as wheels; none needs a
     compiler. requirements/mirror_audit.txt from the release build is the
     authoritative list."
